[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-openapi-generator"
version = "1.0.0"
description = "MCP server for OpenAPI code generation (openapi-generator, swagger-codegen) and validation (Spectral, Vacuum)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.1",
    "tenacity>=8.3.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]
smithery = [
    "docker>=7.0.0",
]

[project.scripts]
mcp-openapi-generator = "mcp_openapi_generator.cli:main"
mcp-openapi-generator-server = "mcp_openapi_generator.server:main"

[project.urls]
Homepage = "https://github.com/mkabdullahi/mcp-openapi-generator"
Repository = "https://github.com/mkabdullahi/mcp-openapi-generator"
Issues = "https://github.com/mkabdullahi/mcp-openapi-generator/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_openapi_generator"]

[tool.ruff]
line-length = 100
target-version = "py311"
preview = true
lint.select = ["E", "F", "I", "W", "UP", "B", "C4", "PTH", "T20", "ARG", "SIM", "RET"]
lint.ignore = ["S101", "T201"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
enable_error_code = ["arg-type", "attr-defined", "no-untyped-call", "no-untyped-def"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = ["integration: tests requiring external CLIs or network access"]

[tool.coverage.run]
source = ["src/mcp_openapi_generator"]
omit = ["*/tests/*", "*/__main__.py"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "def __repr__", "raise AssertionError", "raise NotImplementedError"]